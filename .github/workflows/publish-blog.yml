name: Publish scheduled blog posts

on:
  schedule:
    # Cron is UTC only. Each time is listed for two UTC hours so daylight saving
    # is handled: the script acts only when the local hour in BLOG_TZ matches.
    # Review email: 8 AM local on Tuesday and Friday (one hour before release).
    - cron: "5 12,13 * * 2,5"
    # Release: 9 AM local on Tuesday and Friday.
    - cron: "5 13,14 * * 2,5"
  workflow_dispatch:
    inputs:
      force:
        description: "Release the next ready post now (ignore the schedule)"
        type: boolean
        default: false
      test_email:
        description: "Only send a test review email (does not publish anything)"
        type: boolean
        default: false

permissions:
  contents: write            # needed to record blog/published.json

jobs:
  test-email:
    if: github.event_name == 'workflow_dispatch' && inputs.test_email
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send test email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
        run: python3 blog/tools/send_preview.py --test

  review-email:
    # Runs only for the 8 AM schedule. Needs no Wix access.
    if: github.event_name == 'schedule' && github.event.schedule == '5 12,13 * * 2,5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare review email
        env:
          BLOG_TZ: ${{ vars.BLOG_TZ || 'America/New_York' }}
        run: python3 blog/tools/publish_wix.py --preview "$RUNNER_TEMP/preview"
      - name: Send review email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
        run: python3 blog/tools/send_preview.py "$RUNNER_TEMP/preview"

  publish:
    # Runs for the 9 AM schedule and for manual runs.
    if: (github.event_name == 'workflow_dispatch' && !inputs.test_email) || github.event.schedule == '5 13,14 * * 2,5'
    runs-on: ubuntu-latest
    concurrency: publish-blog
    steps:
      - uses: actions/checkout@v4
      - name: Publish due posts to Wix
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          WIX_MEMBER_ID: ${{ secrets.WIX_MEMBER_ID }}
          WIX_MODE: ${{ vars.WIX_MODE || 'draft' }}
          BLOG_TZ: ${{ vars.BLOG_TZ || 'America/New_York' }}
        run: python3 blog/tools/publish_wix.py ${{ inputs.force && '--force' || '' }}
      - name: Record what was sent
        run: |
          if [ -n "$(git status --porcelain blog/published.json)" ]; then
            git config user.name "blog-bot"
            git config user.email "blog-bot@users.noreply.github.com"
            git add blog/published.json
            git commit -m "Record published blog posts"
            git push
          fi
